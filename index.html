<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBI｜你的資訊整合AI助理</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style/orbi.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <!-- ORBI Logo -->
        <a href="./index.html"><img src="./img/LOGO.png" alt="ORBI Logo" /></a>
      </div>
      <div class="menu-icon">
        <i class="fa-solid fa-bars"></i>
      </div>
      <nav class="nav-menu">
        <ul class="ul-menu">
          <li><a href="#About">關於ORBI</a></li>
          <li><a href="#Services">功能介紹</a></li>
          <li><a href="#Download">下載</a></li>
        </ul>
      </nav>
    </header>
    <section class="Hero">
      <div class="hero-content">
        <div class="hero-text">
          <h1>追星，</h1>
          <h1>不需要追著資訊跑。</h1>
          <p>ORBI為追星族整合散落各處的官方資訊， 透過AI整理、翻譯與提醒，</p>
          <p>讓重要消息主動到你的面前！</p>
        </div>
        <div class="hero-buttons">
          <a href="#Download" class="btn"
            ><i class="fa-brands fa-apple"></i> Apple Store下載
          </a>
          <a href="#Download" class="btn"
            ><i class="fa-brands fa-google-play"></i> Google Play下載
          </a>
        </div>
      </div>
      <div class="hero-photo">
        <img src="./img/hero.png" alt="Hero Image" />
      </div>
    </section>
    <section id="About">
      <div class="about-text">
        <h1>為什麼需要ORBI?</h1>
        <p>喜歡很多團體，資訊也跟著變多…</p>
      </div>
      <div class="aboutwhy">
        <div class="icon">
          <div class="icon-circle">
          <i class="fa-solid fa-magnifying-glass"> </i>
          </div>
          <p>資訊散落各平台需要重複確認</p>
        </div>
        <div class="icon">
          <div class="icon-circle">
          <i class="fa-solid fa-language"></i>
          </div>
          <p>外文公告內容難以一秒理解</p>
        </div>
        <div class="icon">
          <div class="icon-circle">
          <i class="fa-solid fa-hourglass"></i>
          </div>
          <p>售票/簽售/會員不能錯過</p>
        </div>
      </div>
    </section>
  </body>
</html>
